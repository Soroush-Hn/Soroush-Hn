<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Thanks for visiting">
  <title>Thanks for visiting</title>
  <style>
    .entry { animation: entry 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both; }
    @keyframes entry { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F2E2B"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="0.18" cy="0.12" r="0.55">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="0.88" cy="0.92" r="0.60">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#FFFFFF" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="200" fill="url(#bg)"/>
  <rect width="1200" height="200" fill="url(#glowTL)"/>
  <rect width="1200" height="200" fill="url(#glowBR)"/>
  <rect width="1200" height="200" fill="url(#dots)"/>

  <g>
    <path d="M 0 126 C 200 108, 400 108, 600 126 C 800 144, 1000 144, 1200 126 C 1400 108, 1600 108, 1800 126 C 2000 144, 2200 144, 2400 126 L 2400 200 L 0 200 Z" fill="#5EEAD4" fill-opacity="0.30">
      <animate attributeName="fill-opacity" values="0.25;0.45;0.25" dur="6s" repeatCount="indefinite"/>
    </path>
    <animateTransform attributeName="transform" type="translate" from="-1200 0" to="0 0" dur="7s" repeatCount="indefinite"/>
  </g>
  <g>
    <path d="M 0 144 C 200 126, 400 126, 600 144 C 800 162, 1000 162, 1200 144 C 1400 126, 1600 126, 1800 144 C 2000 162, 2200 162, 2400 144 L 2400 200 L 0 200 Z" fill="#14B8A6" fill-opacity="0.45"/>
    <animateTransform attributeName="transform" type="translate" from="-1200 0" to="0 0" dur="11s" repeatCount="indefinite"/>
  </g>
  <g>
    <path d="M 0 162 C 200 144, 400 144, 600 162 C 800 180, 1000 180, 1200 162 C 1400 144, 1600 144, 1800 162 C 2000 180, 2200 180, 2400 162 L 2400 200 L 0 200 Z" fill="#0D9488" fill-opacity="0.65"/>
    <animateTransform attributeName="transform" type="translate" from="-1200 0" to="0 0" dur="16s" repeatCount="indefinite"/>
  </g>

  <g class="entry">
    <circle cx="452" cy="53" r="4" fill="#5EEAD4">
      <animate attributeName="r" values="4;6.5;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="600" y="62" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="26" letter-spacing="3" fill="#5EEAD4">Thanks for visiting</text>
  </g>
</svg>
