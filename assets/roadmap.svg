<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Where I'm heading: production backends today, then architecture and data, distributed systems, and software architecture">
  <title>Where I'm heading — production backends today, then architecture and data, distributed systems, and software architecture</title>
  <style>
    .entry { animation: entry 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both; }
    @keyframes entry { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F2E2B"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="0.18" cy="0.12" r="0.55">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="0.88" cy="0.92" r="0.60">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#FFFFFF" opacity="0.05"/>
    </pattern>
    <mask id="markers" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="420">
      <rect width="1200" height="420" fill="#FFFFFF"/>
      <circle cx="150" cy="162" r="13" fill="#000000"/>
      <circle cx="450" cy="162" r="12" fill="#000000"/>
      <circle cx="750" cy="162" r="12" fill="#000000"/>
      <circle cx="1050" cy="162" r="12" fill="#000000"/>
    </mask>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#glowTL)"/>
  <rect width="1200" height="420" fill="url(#glowBR)"/>
  <rect width="1200" height="420" fill="url(#dots)"/>

  <g opacity="0.6">
    <g stroke="#14B8A6" stroke-width="2" fill="none">
      <path d="M 165 162 H 428"/>
      <path d="M 465 162 H 726"/>
      <path d="M 765 162 H 1026"/>
    </g>
  </g>

  <path id="mainpath" d="M 150 162 L 1050 162" fill="none" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round" stroke-dasharray="900" stroke-dashoffset="900" mask="url(#markers)">
    <animate attributeName="stroke-dashoffset" values="900;0" keyTimes="0;1" calcMode="spline" keySplines="0.25 1 0.5 1" dur="1.6s" begin="0.5s" fill="freeze"/>
  </path>

  <g opacity="0.6" fill="#14B8A6">
    <path d="M 437 162 L 426 156 L 426 168 Z"/>
    <path d="M 737 162 L 726 156 L 726 168 Z"/>
    <path d="M 1037 162 L 1026 156 L 1026 168 Z"/>
  </g>

  <g>
    <circle cx="150" cy="162" r="11" fill="#5EEAD4">
      <animate attributeName="r" values="11;12.5;11" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="162" r="9" fill="none" stroke="#14B8A6" stroke-width="2.5"/>
    <circle cx="750" cy="162" r="9" fill="none" stroke="#14B8A6" stroke-width="2.5"/>
    <circle cx="1050" cy="162" r="9" fill="none" stroke="#14B8A6" stroke-width="2.5"/>
  </g>

  <g class="entry" text-anchor="middle">
    <text x="150" y="196" font-family="'Segoe UI', Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#5EEAD4">NOW</text>
    <text x="150" y="224" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="0.5" fill="#F8FAFC">Production backends</text>
    <text x="150" y="250" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#9CA3AF">JSON:API surfaces, OTP auth, audit trails</text>
    <text x="150" y="270" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#9CA3AF">tested, reviewed, in real users' hands</text>
    <rect x="104" y="284" width="92" height="20" rx="10" fill="#5EEAD4"/>
    <text x="150" y="298" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#0B1220">you are here</text>
  </g>

  <g class="entry" style="animation-delay:0.3s" text-anchor="middle">
    <text x="450" y="196" font-family="'Segoe UI', Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#9CA3AF">NEXT</text>
    <text x="450" y="224" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="0.5" fill="#F8FAFC">Architecture &amp; data</text>
    <text x="450" y="250" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#9CA3AF">Clean boundaries and DTO contracts</text>
    <text x="450" y="270" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#9CA3AF">multi-tenant SaaS, T-SQL internals</text>
  </g>

  <g class="entry" style="animation-delay:0.45s" text-anchor="middle">
    <text x="750" y="196" font-family="'Segoe UI', Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#9CA3AF">THEN</text>
    <text x="750" y="224" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="0.5" fill="#F8FAFC">Distributed systems</text>
    <text x="750" y="250" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#9CA3AF">Temporal workflows, gRPC services</text>
    <text x="750" y="270" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#9CA3AF">queues, retries, network security</text>
  </g>

  <g class="entry" style="animation-delay:0.6s" text-anchor="middle">
    <path d="M 1050 151 V 116" fill="none" stroke="#14B8A6" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 1050 116 L 1078 124 L 1050 132 Z" fill="#5EEAD4"/>
    <text x="1050" y="196" font-family="'Segoe UI', Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#5EEAD4">GOAL</text>
    <text x="1050" y="224" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="0.5" fill="#F8FAFC">Software architect</text>
    <text x="1050" y="250" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#9CA3AF">Designing systems, not just features</text>
    <text x="1050" y="270" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#9CA3AF">trade-offs, boundaries, long-term cost</text>
  </g>

  <g opacity="0">
    <circle r="10" fill="#5EEAD4" opacity="0.25"/>
    <circle r="5" fill="#5EEAD4"/>
    <animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.5s" fill="freeze"/>
    <animateMotion dur="7s" begin="2.1s" repeatCount="indefinite">
      <mpath xlink:href="#mainpath" href="#mainpath"/>
    </animateMotion>
  </g>
</svg>
